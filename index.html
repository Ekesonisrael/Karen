<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karen Eddy — Professional Video Editor & Colorist</title>
    <meta name="description" content="Personal portfolio of Karen Eddy, Professional Video Editor & Colorist. Specializing in commercial promos, YouTube long-form, social reels, motion graphics, and precision color grading." />
    <meta property="og:title" content="Karen Eddy — Professional Video Editor & Colorist" />
    <meta property="og:description" content="Personal portfolio of Karen Eddy, Professional Video Editor & Colorist. High-impact commercial cuts, documentary storytelling, and color grading." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0A0A0A] text-[#FFFFFF] selection:bg-[#FF2A85] selection:text-[#FFFFFF] antialiased">
    <div id="root">
      <!-- 2. HERO SECTION -->
      <section id="hero" class="relative w-full overflow-hidden bg-black flex flex-col justify-center pt-20 sm:pt-28 pb-10 sm:pb-14 min-h-screen">
        
        <!-- Full-Width Background Video (Scroll-Controlled) -->
        <video
          muted
          playsinline
          preload="auto"
          class="absolute inset-0 w-full h-full object-contain md:object-cover object-center z-0 pointer-events-none"
          src="https://res.cloudinary.com/djkiddls/video/upload/f_mp4,vc_h264,q_auto/Create_smooth_seamless_transition_1f8d059e.mp4"
        ></video>

        <!-- 40% Black Overlay between video and text -->
        <div class="absolute inset-0 bg-black/40 z-[1] pointer-events-none"></div>

        <div class="relative max-w-7xl mx-auto px-6 z-10 w-full">
          <!-- Top Award Badge -->
          <div class="flex justify-center mb-6">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#141416]/90 backdrop-blur-md border border-[#26262B] font-sans text-xs text-zinc-300 shadow-sm">
              <span class="w-5 h-5 rounded-full bg-[#1E1E24] flex items-center justify-center text-[#FF2A85] font-bold text-xs">★</span>
              <span class="font-medium">Award-Winning Video Editor & Colorist</span>
            </div>
          </div>

          <!-- Main Title & Rotating Stamp Row -->
          <div class="relative text-center max-w-3xl mx-auto mb-10">
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-bold tracking-tight text-white leading-[1.05] drop-shadow-md">
              I'm <span class="text-[#FF2A85]">Karen Eddy</span>
              <span class="inline-block text-[#FF2A85] text-3xl sm:text-5xl ml-1 font-serif select-none">✦</span>
            </h1>
            <p class="text-zinc-300 font-sans text-sm sm:text-base md:text-lg mt-3 font-normal drop-shadow">
              Professional Video Editor & Colorist
            </p>
          </div>

          <!-- Central Stage Area with Centered Character Focus -->
          <div class="relative max-w-3xl mx-auto min-h-[380px] sm:min-h-[460px] md:min-h-[500px] flex justify-center items-center pt-4">
            <!-- Bottom Overlapping CTAs -->
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 bg-[#141416]/95 backdrop-blur-md p-1 rounded-full shadow-xl border border-[#26262B]">
              <a href="#iceberg" class="bg-[#FF2A85] text-white font-sans text-xs sm:text-sm font-bold px-6 py-2.5 rounded-full flex items-center gap-2 shadow-md shadow-[#FF2A85]/25">
                <span>Portfolio</span>
                <span class="w-5 h-5 rounded-full bg-[#0A0A0A] text-white flex items-center justify-center text-[10px]">→</span>
              </a>
              <a href="#about" class="bg-[#141416] text-white border border-[#26262B] font-sans text-xs sm:text-sm font-semibold px-6 py-2.5 rounded-full">
                Hire Me
              </a>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
